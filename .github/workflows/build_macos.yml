name: Build macOS Desktop App

on:
  # Trigger manually from GitHub Actions tab or when pushing a version tag (e.g. v1.2.0).
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_macos:
    name: Build macOS Release (.dmg)
    runs-on: macos-15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (3.44.2)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Cache CocoaPods (speeds up ffmpeg_kit download)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            macos/Pods
          key: pods-macos-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pods-macos-

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Install Dart & Flutter dependencies
        run: flutter pub get

      - name: Build macOS release app
        run: flutter build macos --release

      - name: Package .dmg
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${APP_VERSION}"
          fi
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

          mkdir -p dist/dmg_stage
          cp -R "build/macos/Build/Products/Release/VideoToolKit.app" dist/dmg_stage/
          ln -s /Applications dist/dmg_stage/Applications
          hdiutil create \
            -volname "VideoToolKit" \
            -srcfolder dist/dmg_stage \
            -ov \
            -format UDZO \
            "dist/VideoToolKit-${APP_VERSION}-macos.dmg"

      - name: Publish direct .dmg download to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: VideoToolKit ${{ env.RELEASE_TAG }}
          files: dist/VideoToolKit-${{ env.APP_VERSION }}-macos.dmg
