name: Build macOS Desktop App

on:
  # Trigger manually from GitHub Actions tab or when pushing a version tag (e.g. v1.0.0).
  # Avoids running a slow macOS build on every routine commit.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_macos:
    name: Build macOS Release (.dmg)
    runs-on: macos-15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache CocoaPods (speeds up ffmpeg_kit download)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            macos/Pods
          key: pods-macos-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pods-macos-

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Install Dart & Flutter dependencies
        run: flutter pub get

      - name: Build macOS release app
        run: flutter build macos --release

      - name: Package .dmg
        run: |
          mkdir -p dist/dmg_stage
          cp -R "build/macos/Build/Products/Release/video_merger.app" dist/dmg_stage/
          ln -s /Applications dist/dmg_stage/Applications
          hdiutil create \
            -volname "Video Merger" \
            -srcfolder dist/dmg_stage \
            -ov \
            -format UDZO \
            dist/video_merger-macos.dmg

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: video_merger-macos-dmg
          path: dist/video_merger-macos.dmg
          retention-days: 14

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/video_merger-macos.dmg
