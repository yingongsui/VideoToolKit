name: Build macOS Desktop App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_macos:
    name: Build macOS Release (.app / .dmg)
    runs-on: macos-15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Install Dart & Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Build macOS release app
        run: flutter build macos --release

      - name: Package .app into .zip and .dmg
        run: |
          mkdir -p dist/dmg_stage
          APP_PATH="build/macos/Build/Products/Release/video_merger.app"

          # Use ditto to preserve macOS bundle symlinks and embedded frameworks.
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/video_merger-macos.zip

          # Create a drag-and-drop DMG image using built-in hdiutil.
          cp -R "$APP_PATH" dist/dmg_stage/
          ln -s /Applications dist/dmg_stage/Applications
          hdiutil create \
            -volname "Video Merger" \
            -srcfolder dist/dmg_stage \
            -ov \
            -format UDZO \
            dist/video_merger-macos.dmg

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video_merger-macos
          path: |
            dist/video_merger-macos.zip
            dist/video_merger-macos.dmg
          retention-days: 14

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/video_merger-macos.zip
            dist/video_merger-macos.dmg
