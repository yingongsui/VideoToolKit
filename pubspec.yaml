name: video_merger
description: "VideoToolKit - Desktop video media library, lossless merger, and frame-accurate trimmer."
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  ffmpeg_kit_flutter_new: ^4.7.2
  path_provider: ^2.1.5          # Temporary and cache directories
  shared_preferences: ^2.3.2     # Persist settings and library folders
  file_picker: ^8.3.7            # Native desktop file and folder picker

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
